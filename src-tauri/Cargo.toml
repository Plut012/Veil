[package]
name = "veil"
version = "0.1.0"
edition = "2021"

[lib]
name = "veil_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "veil"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sodiumoxide = "0.2"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
regex = "1"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
toml = "0.8"
qrcode = "0.14"
image = "0.25"
log = "0.4"
thiserror = "2"
async-trait = "0.1"
rpassword = "5"
grammers-client = "0.9"
grammers-session = "0.9"
grammers-tl-types = "0.9"

[build-dependencies]
tauri-build = { version = "2", features = [] }
