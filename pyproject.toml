[project]
name = "veil"
version = "0.1.0"
description = "End-to-end encryption wrapping existing messaging platforms"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "websockets>=14.0",
    "telethon>=1.37",
    "pynacl>=1.5",
    "qrcode>=8.0",
    "pillow>=11.0",
    "tomli>=2.0",
    "tomli-w>=1.0",
]

[project.scripts]
veil = "veil.app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veil"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
